worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Optimizasyonu
    gzip on;
    gzip_disable "msie6";

    server {
        listen 80;
        server_name localhost;

        # Sadece /api/ ile başlayan istekleri internal Next.js servisine yönlendirir
        location /api/ {
            proxy_pass http://nextjs_api:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Host ve İstemci IP Bilgilerini Backend'e İletmek (Zorunlu İstek)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache_bypass $http_upgrade;
        }

        # Root veya diğer dizinler için güvenlik amacıyla 404 dönülebilir (Opsiyonel Güvenlik Katmanı)
        # location / {
        #     return 404;
        # }
    }
}
